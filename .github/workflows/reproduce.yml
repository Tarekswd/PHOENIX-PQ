# Re-runs the cheap, deterministic parts of the HQC experiments on every push.
# Long runs (Valgrind matrix, 15-minute DFR simulations, dudect) stay manual; see README.
name: reproduce

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hqc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev

      - name: Fetch HQC v5.1.0
        run: git clone --quiet --depth 1 --branch v5.1.0 https://gitlab.com/pqc-hqc/hqc.git ../hqc

      - name: Build matrix with KAT gate (HQC-1)
        run: |
          bash experiments/hqc-ct/build_matrix.sh ../hqc out/ct v5.1.0 1
          # Only the known AVX2 strict-aliasing builds (HQC #39/#46) may fail
          failing=$(awk -F'\t' 'NR > 1 && $2 != "PASS" {print $1}' out/ct/build_summary.tsv | sort | tr '\n' ' ')
          echo "failing: $failing"
          test "$failing" = "v5.1.0-avx256-gcc-O2-hqc1 v5.1.0-avx256-gcc-Os-hqc1 "

      - name: DFR simulator positive controls (HQC-1/3/5)
        run: |
          for v in 1 3 5; do
            bash experiments/hqc-dfr/build.sh ../hqc $v out/dfr/hqc$v
            out/dfr/hqc$v/dfr_sim selftest 50
          done

      - name: Short natural-noise run and analysis
        run: |
          mkdir -p out/runs
          out/dfr/hqc1/dfr_sim 20 > out/runs/natural_hqc1_1.txt
          python3 experiments/hqc-dfr/analyze.py out/runs

      - name: Crafted-ciphertext check
        run: |
          bash experiments/hqc-dfr/crafted.sh ../hqc out/crafted 200 20 | tee crafted.log
          grep -q 'RESULT: identical' crafted.log

  phx-tri:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang cmake libssl-dev

      - name: Fetch pinned HQC v5.1.0 and liboqs 8adabb7
        run: |
          git clone --quiet --depth 1 --branch v5.1.0 https://gitlab.com/pqc-hqc/hqc.git ../hqc
          git init --quiet ../liboqs
          git -C ../liboqs fetch --quiet --depth 1 https://github.com/open-quantum-safe/liboqs.git 8adabb7703b5bb1ce835fb792e5b7bdf909b150a
          git -C ../liboqs checkout --quiet FETCH_HEAD

      - name: Build, self-tests and test vectors (GCC and Clang)
        run: |
          for cc in gcc clang; do
            CC=$cc bash phx-tri/build.sh ../hqc ../liboqs out/phx-$cc
            out/phx-$cc/test_phx_tri
            out/phx-$cc/test_phx_tri vectors 8 > out/phx-$cc/vectors.txt
            python3 phx-tri/tests/check_vectors.py out/phx-$cc/vectors.txt phx-tri/vectors/phx_tri_v0.txt
          done
